
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethos UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Instrument Sans', sans-serif;
            transition: background-color 0.5s ease-in-out, color 0.5s ease-in-out;
        }
        .font-serif {
            font-family: 'Instrument Serif', serif;
        }
        /* Custom transitions for the Environment feel */
        .ethos-transition {
            transition: all var(--ethos-motion-duration, 0.3s) var(--ethos-motion-easing, cubic-bezier(0.4, 0, 0.2, 1));
        }
        .glass-effect {
            backdrop-filter: blur(var(--ethos-glass-blur, 0px));
            background: var(--ethos-glass-bg, transparent);
        }
    </style>
<script type="importmap">

  }
}
</script>
</head>
<body class="bg-[var(--ethos-bg)] text-[var(--ethos-text)]">

</body>
</html>
